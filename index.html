<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jhrzin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Dela+Gothic+One&family=Schibsted+Grotesk:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <image id="art" href="art.png" width="593" height="597"/>
    <pattern id="stripes" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="16" style="fill:#17110F;opacity:.09"/>
    </pattern>
  </defs>
</svg>

<header class="top">
  <div class="wrap bar">
    <nav class="tabs" role="tablist" aria-label="Seções do portfólio" id="tabs"></nav>
    <div class="lang-sw" id="lang" role="group"></div>
    <button class="btn" type="button" id="quoteBtn" data-scroll="contato">Orçamento</button>
  </div>
</header>

<main>
  <section class="panel" id="p-motion" hidden></section>
  <section class="panel" id="p-animacao" hidden></section>
</main>

<footer class="foot" id="contato"></footer>

<script src="script.js"></script>
</body>
</html>
